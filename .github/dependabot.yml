# Bağımlılık güncellemeleri: GitHub her hafta bilinen açıkları ve yeni sürümleri kontrol eder,
# gerekirse güncelleme isteği (PR) açar. Güvenlik açığı uyarıları ayrıca depo ayarlarından açılır.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    groups:
      kucuk-guncellemeler:
        update-types: ["minor", "patch"]
    # TypeScript 7: typescript-eslint henüz desteklemiyor (lint "does not support TS 7.0" hatasıyla durur).
    # Destek gelince bu satırları silip yükselt. (Kasım 2026)
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    groups:
      kucuk-guncellemeler:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    groups:
      kucuk-guncellemeler:
        update-types: ["minor", "patch"]
